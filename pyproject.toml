[project]
name = "arena-narrator"
version = "0.1.0"
description = "Narrate Kaggle Game Arena chess episodes (EN/ES) around each model's own reasoning, with edge-tts or Piper and a tiny synced board viewer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "gamaerry" }]
keywords = ["chess", "llm", "kaggle", "game-arena", "tts", "commentary", "piper", "edge-tts"]
dependencies = [
    "httpx>=0.27",
    "chess>=1.11",
    "mutagen>=1.47",
]

[project.optional-dependencies]
edge = ["edge-tts>=7.0"]
piper = ["piper-tts>=1.3"]
anthropic = ["anthropic>=0.60"]
gemini = ["google-genai>=1.30"]
all = ["arena-narrator[edge,piper,anthropic,gemini]"]

[project.scripts]
arena-narrator = "arena_narrator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_narrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
